server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver internal Docker (127.0.0.11)
    # ipv6=off mencegah lookup delay IPv6 pada Docker bridge network
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Izinkan upload dokumen bukti kas & gambar hingga 35MB
    client_max_body_size 35M;

    # Proxy API ke backend container
    location /api/ {
        set $backend_upstream "http://backend-xb:3003";
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Proxy uploads ke backend container jika diakses langsung lewat /uploads/
    location /uploads/ {
        set $backend_upstream "http://backend-xb:3003";
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Khusus index.html: jangan pernah di-cache agar refresh langsung update ke versi terbaru
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # SPA routing: arahkan semua rute yang bukan file ke index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Cache dan serve file gambar/media (misal /img/og.jpg, /og-image.png, favicon)
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Cache file aset statis Vite (JS, CSS)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
