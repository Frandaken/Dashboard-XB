server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver internal Docker (127.0.0.11)
    # ipv6=off mencegah lookup delay IPv6 pada Docker bridge network
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy API ke backend container
    location /api/ {
        set $backend_upstream "http://backend-xb:3003";
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA routing: arahkan semua rute yang bukan file ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache file aset statis Vite (JS, CSS, gambar)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
