server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defensive Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Izinkan upload dokumen bukti kas & gambar hingga 35MB
    client_max_body_size 35M;

    # Proxy API ke backend container
    location /api/ {
        proxy_pass http://backend-xb:3003;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Proxy uploads ke backend container jika diakses langsung lewat /uploads/
    location /uploads/ {
        proxy_pass http://backend-xb:3003;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Khusus index.html: jangan pernah di-cache agar refresh langsung update ke versi terbaru
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # SPA routing: arahkan semua rute yang bukan file ke index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Khusus rute gambar OpenGraph /img/og dan /img/og.jpg
    location = /img/og {
        default_type image/jpeg;
        try_files /img/og.jpg /img/og /og-image.png =404;
        expires 7d;
        add_header Cache-Control "public, no-transform" always;
    }

    # Cache dan serve file gambar/media (misal /img/og.jpg, /og-image.png, favicon)
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Cache file aset statis Vite (JS, CSS)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
