<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A3F" />
      <stop offset="100%" stop-color="#1B3B28" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D398" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#609A76" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Calendar / Class Schedule Symbol -->
  <g transform="translate(106, 80)">
    <!-- Calendar Top Bar -->
    <rect x="0" y="40" width="300" height="230" rx="28" fill="#FAF6EE" />
    <path d="M0 68 C0 52 12 40 28 40 L272 40 C288 40 300 52 300 68 L300 100 L0 100 Z" fill="url(#goldGrad)" />
    
    <!-- Calendar Rings -->
    <rect x="50" y="18" width="20" height="44" rx="10" fill="#E4DDCE" stroke="#3F6E52" stroke-width="6" />
    <rect x="230" y="18" width="20" height="44" rx="10" fill="#E4DDCE" stroke="#3F6E52" stroke-width="6" />

    <!-- Text: XB -->
    <text x="150" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="108" fill="#1B3B28" text-anchor="middle" letter-spacing="-2">XB</text>
  </g>

  <!-- Subtitle banner -->
  <g transform="translate(156, 360)">
    <rect x="0" y="0" width="200" height="48" rx="24" fill="#3F6E52" stroke="url(#goldGrad)" stroke-width="3" />
    <text x="100" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#FAF6EE" text-anchor="middle" letter-spacing="3">JADWAL</text>
  </g>
</svg>
