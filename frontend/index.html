    <script>
      // Suppress benign WebSocket / HMR connection errors in AI Studio iframe environment
      window.addEventListener('error', function(event) {
        if (
          event.message &&
          (event.message.indexOf('WebSocket') !== -1 ||
           event.message.indexOf('@vite/client') !== -1 ||
           event.message.indexOf('ModuleRunnerTransport') !== -1)
        ) {
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event.reason || '');
        if (
          str.indexOf('WebSocket') !== -1 ||
          str.indexOf('@vite/client') !== -1 ||
          str.indexOf('ModuleRunnerTransport') !== -1
        ) {
          event.preventDefault();
        }
      });
    </script>
