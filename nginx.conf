server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        text/calendar;

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching (1 year immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Favicon and root assets
    location ~* \.(ico|png|jpg|jpeg|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Healthcheck endpoint
    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok","engine":"nginx","github_repo":"Frandaken/Dashboard-XB"}';
    }

    # Clear cache endpoint
    location = /api/refresh {
        default_type application/json;
        return 200 '{"ok":true,"message":"cache refreshed"}';
    }

    # ============================================================
    # Google Calendar Proxy Endpoints (solves 401 and CORS errors)
    # ============================================================
    location = /api/calendar/pelajaran {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        proxy_pass https://calendar.google.com/calendar/ical/a4fd56ccb6ac7cde9478e4d863191dd53cd12c6110fe380d6bf279da0e44dc8e%40group.calendar.google.com/private-f67cd9352a27790460116ba8a612434c/basic.ics;
        proxy_ssl_server_name on;
        proxy_set_header Host calendar.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Content-Type "text/calendar; charset=utf-8";
    }

    location = /api/calendar/birthday {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        proxy_pass https://calendar.google.com/calendar/ical/c83e6edc41cc4489ab2a435d067ef46014bfd0fefa8fc964d83ecdc72a5e59d5%40group.calendar.google.com/private-b45f7ec9aad159bf2e0dca6627311f2b/basic.ics;
        proxy_ssl_server_name on;
        proxy_set_header Host calendar.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Content-Type "text/calendar; charset=utf-8";
    }

    # ============================================================
    # Google Sheets CSV Proxy Endpoints
    # ============================================================
    location = /api/sheets/doa {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        proxy_pass https://docs.google.com/spreadsheets/d/e/2PACX-1vRU3A29DVHfQZkjsDcUPnAojvTldw2tpSxSGwaG1O8m4pXD8I8NVPeaF0U1TLYtqUzZjDJujYRu1OHp/pub?gid=0&single=true&output=csv;
        proxy_ssl_server_name on;
        proxy_set_header Host docs.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    location = /api/sheets/mbg {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        proxy_pass https://docs.google.com/spreadsheets/d/e/2PACX-1vRU3A29DVHfQZkjsDcUPnAojvTldw2tpSxSGwaG1O8m4pXD8I8NVPeaF0U1TLYtqUzZjDJujYRu1OHp/pub?gid=215098819&single=true&output=csv;
        proxy_ssl_server_name on;
        proxy_set_header Host docs.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    location = /api/sheets/piket {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        proxy_pass https://docs.google.com/spreadsheets/d/e/2PACX-1vRU3A29DVHfQZkjsDcUPnAojvTldw2tpSxSGwaG1O8m4pXD8I8NVPeaF0U1TLYtqUzZjDJujYRu1OHp/pub?gid=1149044316&single=true&output=csv;
        proxy_ssl_server_name on;
        proxy_set_header Host docs.google.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Content-Type "text/plain; charset=utf-8";
    }
}
