services:
  frontend-xb:
    build:
      context: https://github.com/Frandaken/Dashboard-XB.git
      dockerfile: frontend/Dockerfile
      no_cache: true
    container_name: dashboard-xb-frontend
    ports:
      - 8101:80
    restart: unless-stopped
    depends_on:
      - backend-xb
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dashboard-net

  backend-xb:
    build:
      context: https://github.com/Frandaken/Dashboard-XB.git
      dockerfile: backend/Dockerfile
      no_cache: true
    container_name: dashboard-xb-backend
    ports:
      - 3003:3003 # Backend communication & health check
    environment:
      - PORT=3003
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      dashboard-net:
        aliases:
          - backend-xb
          - backend
          - dashboard-xb-backend
          
networks:
  dashboard-net:
    driver: bridge