services:
  frontend-xb:
    build:
      context: https://github.com/Frandaken/Dashboard-XB.git
      dockerfile: frontend/Dockerfile
      no_cache: true
    container_name: dashboard-xb-frontend
    ports:
      - 8101:80
    restart: unless-stopped
    depends_on:
      - backend-xb
    networks:
      - dashboard-net

  backend-xb:
    build:
      context: https://github.com/Frandaken/Dashboard-XB.git
      dockerfile: backend/Dockerfile
      no_cache: true
    container_name: dashboard-xb-backend
    ports:
      - 3003:3003 # Backend communication & health check
    environment:
      - PORT=3003
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/data/uploads
      - APP_URL=${APP_URL:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CALENDAR_FEED_PELAJARAN=${CALENDAR_FEED_PELAJARAN:-}
      - CALENDAR_FEED_BIRTHDAY=${CALENDAR_FEED_BIRTHDAY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      dashboard-net:
        aliases:
          - backend-xb
          - backend
          - dashboard-xb-backend
          
networks:
  dashboard-net:
    driver: bridge