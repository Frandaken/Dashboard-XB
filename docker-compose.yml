services:
  frontend-xb:
    image: ghcr.io/frandaken/dashboard-xb-frontend:latest
    container_name: dashboard-xb-frontend
    ports:
      - 8101:80
    environment:
      - VITE_APP_VERSION=${VITE_APP_VERSION:-${APP_VERSION:-}}
      - APP_VERSION=${APP_VERSION:-${VITE_APP_VERSION:-}}
    restart: unless-stopped
    depends_on:
      backend-xb:
        condition: service_healthy
    networks:
      - dashboard-net
    labels:
      - com.centurylinklabs.watchtower.enable=true

  backend-xb:
    image: ghcr.io/frandaken/dashboard-xb-backend:latest
    container_name: dashboard-xb-backend
    ports:
      - 3003:3003
    environment:
      - PORT=3003
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/data/uploads
      - APP_URL=${APP_URL:-}
      - VITE_APP_VERSION=${VITE_APP_VERSION:-${APP_VERSION:-}}
      - APP_VERSION=${APP_VERSION:-${VITE_APP_VERSION:-}}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CALENDAR_FEED_PELAJARAN=${CALENDAR_FEED_PELAJARAN:-}
      - CALENDAR_FEED_BIRTHDAY=${CALENDAR_FEED_BIRTHDAY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - SITATIB_USERNAME=${SITATIB_USERNAME:-}
      - SITATIB_PASSWORD=${SITATIB_PASSWORD:-}
      - SITATIB_ACADEMIC_YEAR_ID=${SITATIB_ACADEMIC_YEAR_ID:-3}
      - KAS_PAYMENT_ENABLED=${KAS_PAYMENT_ENABLED:-true}
      - KAS_QRIS_IMAGE_URL=${KAS_QRIS_IMAGE_URL:-}
      - KAS_PAYMENT_BANK_NAME=${KAS_PAYMENT_BANK_NAME:-Bank Digital (QRIS)}
      - KAS_PAYMENT_MERCHANT_NAME=${KAS_PAYMENT_MERCHANT_NAME:-Kas Kelas XB — SMA Putra Nirmala}
      - KAS_PAYMENT_ACCOUNT_HOLDER=${KAS_PAYMENT_ACCOUNT_HOLDER:-}
      - KAS_PAYMENT_NMID=${KAS_PAYMENT_NMID:-}
      - KAS_PAYMENT_WEEKLY_AMOUNT=${KAS_PAYMENT_WEEKLY_AMOUNT:-3000}
      - KAS_PAYMENT_TREASURER_WA=${KAS_PAYMENT_TREASURER_WA:-}
      - KAS_PAYMENT_NOTE=${KAS_PAYMENT_NOTE:-}
    volumes:
      - /mnt/nas-pool/Share/Franda/SEKOLAH:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3003/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      dashboard-net:
        aliases:
          - backend-xb
          - backend
          - dashboard-xb-backend
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  dashboard-net:
    driver: bridge