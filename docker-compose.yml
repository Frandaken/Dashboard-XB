services:
  frontend-xb:
    build:
      context: https://github.com/Frandaken/Dashboard-XB.git
      dockerfile: frontend/Dockerfile
      no_cache: true
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-}
    container_name: dashboard-xb-frontend
    ports:
      - 8101:80
    restart: unless-stopped
    depends_on:
      backend-xb:
        condition: service_healthy
    networks:
      - dashboard-net

  backend-xb:
    build:
      context: https://github.com/Frandaken/Dashboard-XB.git
      dockerfile: backend/Dockerfile
      no_cache: true
    container_name: dashboard-xb-backend
    ports:
      - 3003:3003 # Backend communication & health check
    environment:
      - PORT=3003
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/data/uploads
      - APP_URL=${APP_URL:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CALENDAR_FEED_PELAJARAN=${CALENDAR_FEED_PELAJARAN:-}
      - CALENDAR_FEED_BIRTHDAY=${CALENDAR_FEED_BIRTHDAY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      dashboard-net:
        aliases:
          - backend-xb
          - backend
          - dashboard-xb-backend
          
networks:
  dashboard-net:
    driver: bridge