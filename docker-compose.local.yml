services:
  frontend-xb:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dashboard-xb-frontend
    ports:
      - 8202:80
    restart: unless-stopped
    depends_on:
      - backend-xb
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dashboard-net

  backend-xb:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dashboard-xb-backend
    ports:
      - 3003:3003
    environment:
      - PORT=3003
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      dashboard-net:
        aliases:
          - backend-xb
          - backend
          - dashboard-xb-backend

networks:
  dashboard-net:
    driver: bridge
