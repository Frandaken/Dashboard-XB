# Jalankan dengan Bake engine aktif:
#   COMPOSE_BAKE=true docker compose -f docker-compose.local.yml up -d --build
# (Atau tambahkan COMPOSE_BAKE=true di file .env root proyek)
services:
  frontend-xb:
    image: dashboard-xb-frontend:${TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      platforms:
        - linux/amd64
      no_cache: true
      x-bake:
        tags:
          - dashboard-xb-frontend:${TAG:-latest}
    container_name: dashboard-xb-frontend
    ports:
      - 8202:80
    restart: unless-stopped
    depends_on:
      - backend-xb
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dashboard-net

  backend-xb:
    image: dashboard-xb-backend:${TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      platforms:
        - linux/amd64
      no_cache: true
      x-bake:
        tags:
          - dashboard-xb-backend:${TAG:-latest}
    container_name: dashboard-xb-backend
    ports:
      - 3003:3003 # Backend communication & health check
    environment:
      - PORT=3003
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/data/uploads
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      dashboard-net:
        aliases:
          - backend-xb
          - backend
          - dashboard-xb-backend

networks:
  dashboard-net:
    driver: bridge
